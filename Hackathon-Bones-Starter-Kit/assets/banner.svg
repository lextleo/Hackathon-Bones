<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Hackathon Bones</title>
  <desc id="desc">A dark technical banner with a glowing green pixel motif and the words build fast, ship something real.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151d"/>
      <stop offset="1" stop-color="#191d29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8be9a8"/>
      <stop offset="1" stop-color="#d7ff88"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#91a3bb" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>
  <path d="M0 270H1200" stroke="#8be9a8" stroke-opacity=".2"/>
  <path d="M850 0L1200 210M980 0L1200 132" stroke="#8ea7ff" stroke-opacity=".12" stroke-width="2"/>
  <g transform="translate(875 55)" fill="none" stroke="url(#accent)" stroke-width="3" filter="url(#glow)">
    <path d="M45 34l32 32-32 32-32-32z"/>
    <path d="M98 34l32 32-32 32-32-32z" opacity=".75"/>
    <path d="M72 88l32 32-32 32-32-32z" opacity=".5"/>
    <path d="M150 66h95M198 42v48" stroke-dasharray="5 7" opacity=".5"/>
    <circle cx="245" cy="66" r="5" fill="#d7ff88" stroke="none"/>
  </g>
  <g fill="#8be9a8" font-family="monospace" font-size="13" letter-spacing="3">
    <text x="72" y="76">FIELD NOTES / 001</text>
    <text x="72" y="286" fill="#92a0b3" font-size="11" letter-spacing="2">A REUSABLE BASECAMP FOR TIME-BOXED BUILDS</text>
  </g>
  <text x="66" y="166" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="64" letter-spacing="-2">HACKATHON</text>
  <text x="66" y="226" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="64" letter-spacing="-2">BONES<span fill="#ffb86c">_</span></text>
  <rect x="66" y="246" width="110" height="4" rx="2" fill="#ffb86c"/>
  <g fill="#aab6c8" font-family="monospace" font-size="12">
    <text x="1008" y="291" text-anchor="end">BUILD FAST.</text>
    <text x="1125" y="310" text-anchor="end" fill="#8be9a8">SHIP SOMETHING REAL.</text>
  </g>
</svg>
